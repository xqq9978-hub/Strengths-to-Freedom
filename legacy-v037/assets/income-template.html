<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五年后，三条路 · 光点沿线动效</title>
<style>
:root{color-scheme:dark;--bg:#080d17;--surface:#101725;--ink:#f1f3f8;--muted:#929ba9;--blue:#79b5ff;--gold:#f3cd7c;--green:#89d5b1;--active:var(--blue)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid #f3cd7c;outline-offset:5px}.shell{max-width:1180px;padding:32px 44px 36px;margin:auto}.mast{display:flex;justify-content:space-between;align-items:center;gap:18px;color:var(--muted);font-size:11px;letter-spacing:.14em}.brand{display:flex;align-items:center;gap:9px}.brand:before{content:"";height:8px;width:8px;border-radius:50%;background:#f3dfb0;box-shadow:0 0 14px #f3dfb066}.demo{padding:6px 10px;border:1px solid #ffffff16;border-radius:30px;font-size:11px;letter-spacing:0}header{margin:37px 0 28px;display:flex;align-items:end;justify-content:space-between;gap:20px}h1{font-size:clamp(28px,3.7vw,43px);line-height:1.28;letter-spacing:-.035em;margin:0 0 10px;font-weight:650}header p{font-size:13px;line-height:1.7;color:var(--muted);margin:0}.switch{display:flex;gap:4px;padding:4px;border:1px solid #ffffff0b;background:#ffffff04;border-radius:10px;flex-shrink:0}.switch button{border:0;padding:10px 14px;background:none;color:var(--muted);font-size:12px;border-radius:7px}.switch button[aria-pressed=true]{color:#efede5;background:#29303c}.panel{border:1px solid #ffffff0d;border-radius:22px;padding:26px 30px 20px;background:radial-gradient(ellipse at 30% 10%,#18203070,transparent 70%),var(--surface);overflow:hidden;box-shadow:0 20px 70px #0000001a}.chart-header{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--muted)}.selection{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:17px;font-weight:550}.selection i{display:block;width:7px;height:7px;border-radius:50%;background:var(--active);box-shadow:0 0 12px color-mix(in srgb,var(--active) 60%,transparent)}.final-value{text-align:right}.final-value label{font-size:11px;color:var(--muted)}.final-value strong{display:block;font-family:"Helvetica Neue",Arial,sans-serif;font-size:38px;line-height:1.18;letter-spacing:-.035em;font-weight:500;color:var(--active);font-variant-numeric:tabular-nums}.final-value small{font-family:inherit;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0}.chart-wrap{position:relative;margin-top:10px}.chart{display:block;width:100%;overflow:visible}.grid{stroke:#ffffff09;stroke-width:1}.tick{font-size:11px;fill:#8a95a5}.axis-note{font-size:10px;fill:#7c8798;letter-spacing:.02em}.base-path{fill:none;stroke:#606b7d;stroke-width:1.8;opacity:.28}.trace{fill:none;stroke:var(--active);stroke-width:3;stroke-linecap:round;pointer-events:none}.aura{fill:none;stroke:var(--active);stroke-width:5;opacity:.6;pointer-events:none;filter:url(#line-glow)}.hit{fill:none;stroke:transparent;stroke-width:22;cursor:pointer;pointer-events:stroke}.marker{fill:#101725;stroke:#535f73;stroke-width:1.5;transition:stroke .25s,fill .25s,opacity .25s}.marker-group{opacity:.35;transition:opacity .3s}.marker-group.lit{opacity:1}.lit .marker{stroke:var(--active);fill:#111b29;stroke-width:2}.point-value{font-size:11px;fill:#9ba5b5}.lit .point-value{fill:var(--active)}.endpoint{font-size:14px;font-weight:650;fill:#586274;transition:fill .3s}.endpoint.lit{fill:var(--active)}.start-label{font-size:11px;fill:#e4d9c3}.branch-node rect{fill:#161d2a;stroke:#303949;stroke-width:1}.branch-node.lit rect{fill:color-mix(in srgb,var(--active) 8%,#151c28);stroke:color-mix(in srgb,var(--active) 35%,transparent)}.branch-node text{fill:#788292;font-size:10px}.branch-node .node-value{font-size:15px;font-weight:600;fill:#858e9d}.branch-node.lit .node-value{fill:var(--active)}.branch-node.lit .node-year{fill:#c1c7d0}.branch-node{opacity:.32;transition:opacity .3s}.branch-node.lit{opacity:1}.playback{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid #ffffff09;padding-top:15px;margin-top:4px;color:var(--muted);font-size:11px}.progress-state{display:flex;align-items:center;gap:8px}.progress-dot{height:5px;width:5px;background:var(--active);border-radius:50%}.replay{background:transparent;color:#c3cbd8;border:1px solid #ffffff15;border-radius:7px;padding:8px 12px;font-size:11px}.replay:hover{border-color:#ffffff45;background:#ffffff06}.replay span{font-size:15px;margin-right:5px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:17px}.choice{background:#111824;border:1px solid #ffffff0d;border-radius:13px;color:#8792a4;text-align:left;padding:18px 19px;transition:background .3s,border-color .3s,color .3s;min-width:0}.choice:hover{background:#192131;border-color:#ffffff24}.choice[aria-pressed=true]{border-color:color-mix(in srgb,var(--c) 65%,transparent);background:color-mix(in srgb,var(--c) 7%,#101725);color:#edf2f7}.choice-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.letter{font-size:11px;letter-spacing:.1em;color:#707e93}.choice[aria-pressed=true] .letter{color:var(--c)}.radio{width:15px;height:15px;border:1px solid #4a5669;border-radius:50%;padding:3px}.choice[aria-pressed=true] .radio{border-color:var(--c)}.choice[aria-pressed=true] .radio:after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:var(--c)}.choice-name{font-size:16px;font-weight:550;margin-top:11px}.choice-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;gap:5px;font-size:11px;color:#778398}.choice-foot b{font-size:22px;line-height:1;font-weight:500;font-family:Arial,sans-serif;font-variant-numeric:tabular-nums;color:#8b97aa}.choice[aria-pressed=true] .choice-foot b{color:var(--c)}.milestones{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px;padding:0 3px}.milestone{opacity:.25;transition:opacity .35s}.milestone.reached{opacity:1}.milestone-head{display:flex;align-items:center;gap:9px;font-size:11px;color:#7f8ba0}.milestone-head:before{content:"";height:5px;width:5px;background:#4a5365;border-radius:50%}.milestone.reached .milestone-head:before{background:var(--active);box-shadow:0 0 8px var(--active)}.milestone strong{display:block;margin-top:9px;font-size:14px;font-weight:500}.milestone p{font-size:11px;color:#8b97a9;margin:6px 0 0}.notes{color:#68778b;font-size:10px;line-height:1.9;margin:27px 3px 0}.notes summary{cursor:pointer;display:inline-block;color:#7f8a9c}.notes p{margin:9px 0 0}.branch-caption{display:none}.shell[data-view=branch] .chart-wrap{max-width:820px;margin:10px auto 0}.shell[data-view=branch] .branch-caption{display:inline}.shell[data-view=branch] .curve-caption{display:none}.status-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:650px){.shell{padding:24px 18px 28px}.mast{font-size:10px;letter-spacing:.07em}.demo{font-size:9px;padding:5px 7px}header{margin:30px 0 20px;display:block}h1{font-size:29px}.switch{display:inline-flex;margin-top:19px}.switch button{min-height:40px;padding:8px 17px}.panel{padding:20px 14px 14px;border-radius:18px}.selection{font-size:15px}.final-value strong{font-size:31px}.eyebrow{font-size:9px;letter-spacing:.09em}.chart-wrap{margin:15px -4px 0}.choices{gap:8px;margin-top:12px}.choice{padding:13px 11px;border-radius:11px}.choice-name{font-size:12px;line-height:1.55;min-height:38px;margin-top:9px}.choice-foot{display:block;margin-top:7px;line-height:1.7}.choice-foot b{font-size:21px;margin-right:3px}.choice-foot .path-desc{display:none}.choice-top{gap:4px}.letter{font-size:10px}.milestones{gap:14px;margin-top:24px}.milestone strong{font-size:12px;line-height:1.6}.milestone p{font-size:10px;line-height:1.5}.progress-state{font-size:10px}.replay{min-height:38px;font-size:11px}.playback{gap:5px}.notes{font-size:10px}.shell[data-view=branch] .panel{padding-left:9px;padding-right:9px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.mast-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.all-paths{border:1px solid #6c8ca6;background:#19354c;color:#eaf5ff;border-radius:7px;font-size:11px;padding:7px 10px;white-space:nowrap;min-height:34px}.all-paths[aria-pressed=true]{background:#294c62;border-color:#89d5b1;color:#d9ffed}.all-mode .point-value{display:none}.all-mode .final-value strong{font-size:22px}.all-mode .final-value small{display:none}.all-mode .choice[aria-pressed=true]{border-color:color-mix(in srgb,var(--c) 70%,transparent)}.endpoint.lit{font-size:14px;font-weight:650}.mast{align-items:flex-start}.all-mode .progress-dot{background:linear-gradient(90deg,#79b5ff,#f3cd7c,#89d5b1);width:15px}.marker-group.lit .marker{stroke-width:2.5}.all-mode .trace{stroke-width:3}.all-mode .aura{opacity:.35}@media(max-width:650px){.mast{gap:10px}.mast .brand{max-width:38%;line-height:1.6;letter-spacing:0}.mast-actions{max-width:62%;gap:6px}.all-paths{font-size:11px;min-height:38px}.all-mode .selection{font-size:14px}.final-value label{font-size:10px}}
</style>
</head>
<body><main class="shell" id="app" data-view="curve">
<div class="mast"><div class="brand">FIVE YEARS / 三种可能</div><div class="mast-actions"><div class="demo">条件情景 · 非收入预测</div><button type="button" class="all-paths" id="allPaths" aria-pressed="false">全部点亮</button></div></div>
<header><div><h1>从同一个起点，<br>点亮你选择的路。</h1><p>选择一条路径，查看条件情景并同步其行动计划。</p></div><div class="switch" role="group" aria-label="图表视图"><button data-view="curve" aria-pressed="true">收入曲线</button><button data-view="branch" aria-pressed="false">分岔路径</button></div></header>
<section class="panel" aria-label="互动收入路径图">
<div class="chart-header"><div><div class="eyebrow">YOUR NEXT FIVE YEARS</div><div class="selection"><i aria-hidden="true"></i><span id="selection-name">待加载路径</span></div></div><div class="final-value"><label id="final-label">第 5 年 · 条件情景</label><strong><span id="final-number"></span> <small>__UNIT_TEXT__</small></strong></div></div>
<div class="chart-wrap" id="chart-wrap"><svg class="chart" id="chart" aria-label="从现在到第五年的三条收入路径，使用下方按钮选择" role="img"></svg></div>
<div class="playback"><div class="progress-state"><span class="progress-dot"></span><span id="progress-text">从现在出发</span></div><button class="replay" id="replay"><span aria-hidden="true">↻</span>重新播放</button></div>
</section>
__INCOME_CHOICES__
<div class="milestones" id="milestones"></div>
<details class="notes"><summary>资料、假设与收入口径 ＋</summary><p id="basisNote"></p><p>条件路径视图中，时间从上到下；横向位置仅区分路线，不表达收入潜力。未知年值不插值、不补零。</p></details>
<p id="announcement" class="status-sr" aria-live="polite"></p>
</main>
<script>__INCOME_RUNTIME__</script>
</body></html>
